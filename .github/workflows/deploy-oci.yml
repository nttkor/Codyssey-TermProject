name: Docker CI and OCI deploy

on:
  # 배포 성공을 머지 조건으로 요구하므로 paths로 실행을 건너뛰지 않는다.
  # 건너뛴 검사는 보고되지 않아 PR이 영구 대기 상태가 된다.
  pull_request:
    branches:
      - develop
      - main
  # develop은 통합 기준이므로 머지 직후 서버를 그 상태로 맞춘다.
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: 2hynmin/codyssey-term
  CONTAINER_NAME: askmate-backend

jobs:
  verify-image:
    name: Verify Docker image
    # 같은 저장소의 PR은 publish-and-deploy가 빌드까지 수행하므로 중복 빌드를 피한다.
    # 시크릿을 받지 못해 배포할 수 없는 포크 PR에서만 빌드 가능 여부를 확인한다.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish image and deploy to OCI
    # 릴리스 서버가 아니므로 PR 단계에서 실제 배포까지 수행하고, 이 잡이 통과해야 머지한다.
    # 포크 PR은 환경 시크릿을 받지 못하므로 verify-image만 수행한다.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: oci-production
      cancel-in-progress: false
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      OCI_SSH_PORT: ${{ vars.OCI_SSH_PORT || '22' }}
      OCI_APP_PORT: ${{ vars.OCI_APP_PORT || '8000' }}
      SESSION_MAX_AGE: ${{ vars.SESSION_MAX_AGE || '3600' }}
      SESSION_HTTPS_ONLY: ${{ vars.SESSION_HTTPS_ONLY || 'false' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_TIMEOUT: ${{ vars.AI_TIMEOUT || '30' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          for required_name in \
            DOCKERHUB_TOKEN \
            OCI_HOST \
            OCI_SSH_USER \
            OCI_SSH_PRIVATE_KEY \
            OCI_SSH_KNOWN_HOSTS \
            TS_OAUTH_CLIENT_ID \
            TS_AUDIENCE \
            SESSION_SECRET_KEY \
            AI_API_KEY \
            AI_BASE_URL \
            AI_MODEL
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Missing required secret: ${required_name}" >&2
              exit 1
            fi
          done

          if [[ ! "$OCI_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_SSH_PORT must be numeric." >&2
            exit 1
          fi

          if [[ ! "$OCI_APP_PORT" =~ ^[0-9]+$ ]]; then
            echo "OCI_APP_PORT must be numeric." >&2
            exit 1
          fi

          if [[ ! "$SESSION_MAX_AGE" =~ ^[1-9][0-9]*$ ]]; then
            echo "SESSION_MAX_AGE must be a positive integer." >&2
            exit 1
          fi

          if [[ "$SESSION_HTTPS_ONLY" != "true" && "$SESSION_HTTPS_ONLY" != "false" ]]; then
            echo "SESSION_HTTPS_ONLY must be true or false." >&2
            exit 1
          fi

          if [[ ! "$AI_BASE_URL" =~ ^https?:// ]]; then
            echo "AI_BASE_URL must start with http:// or https://." >&2
            exit 1
          fi

          python3 backend/app/config_validation.py

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # pull_request의 github.sha는 임시 병합 커밋이므로 추적 가능한 head 커밋을 쓴다.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            revision="$PR_HEAD_SHA"
          else
            revision="$PUSH_SHA"
          fi

          tags=("${IMAGE_NAME}:sha-${revision}")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # 검증 중인 PR 이미지가 :latest를 덮어쓰지 않도록 한다.
            tags+=("${IMAGE_NAME}:pr-${PR_NUMBER}")
          elif [[ "$REF_NAME" == "main" ]]; then
            tags+=("${IMAGE_NAME}:latest")
          else
            # develop 통합본은 latest와 구분해 둔다.
            tags+=("${IMAGE_NAME}:${REF_NAME}")
          fi

          {
            echo "revision=${revision}"
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: 2hynmin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Connect deployment runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.OCI_HOST }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/oci_deploy_key"
          chmod 600 "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to Docker Hub on OCI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "docker login --username 2hynmin --password-stdin"

      - name: Upload application environment to OCI
        shell: bash
        run: |
          set -euo pipefail

          # 값이 원격 프로세스 목록이나 Actions 로그에 남지 않도록 stdin으로만 전달한다.
          {
            printf 'SESSION_SECRET_KEY=%s\n' "$SESSION_SECRET_KEY"
            printf 'SESSION_MAX_AGE=%s\n' "$SESSION_MAX_AGE"
            printf 'SESSION_HTTPS_ONLY=%s\n' "$SESSION_HTTPS_ONLY"
            printf 'AI_API_KEY=%s\n' "$AI_API_KEY"
            printf 'AI_BASE_URL=%s\n' "$AI_BASE_URL"
            printf 'AI_MODEL=%s\n' "$AI_MODEL"
            printf 'AI_TIMEOUT=%s\n' "$AI_TIMEOUT"
          } | ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "umask 077 && cat > ~/.askmate-deploy.env && chmod 600 ~/.askmate-deploy.env"

      - name: Replace OCI container
        shell: bash
        env:
          TARGET_IMAGE: 2hynmin/codyssey-term:sha-${{ steps.image.outputs.revision }}
        run: |
          set -euo pipefail

          printf -v remote_environment \
            'TARGET_IMAGE=%q CONTAINER_NAME=%q OCI_BIND_HOST=%q OCI_APP_PORT=%q' \
            "$TARGET_IMAGE" "$CONTAINER_NAME" "$OCI_HOST" "$OCI_APP_PORT"

          ssh \
            -i "$HOME/.ssh/oci_deploy_key" \
            -p "$OCI_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_HOST" \
            "$remote_environment bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          backup_container="${CONTAINER_NAME}-previous"
          env_file="/opt/askmate/.env"
          deploy_env_file="${HOME}/.askmate-deploy.env"

          # docker run이 값을 읽은 뒤에는 남겨둘 이유가 없다.
          trap 'rm -f "$deploy_env_file"' EXIT

          if [[ ! -f "$deploy_env_file" ]]; then
            echo "배포 환경 파일을 찾을 수 없습니다: ${deploy_env_file}" >&2
            exit 1
          fi

          # OCI_HOST는 배포용 SSH 접속 경로다. 서비스 공개 주소와는 별개다.
          if ! tailscale ip -4 | grep -Fxq "$OCI_BIND_HOST"; then
            echo "OCI_HOST is not assigned to this server's Tailscale interface." >&2
            exit 1
          fi

          # 새 이미지 준비가 실패해도 현재 서비스에는 영향을 주지 않도록 먼저 pull한다.
          docker pull "$TARGET_IMAGE"
          docker rm --force "$backup_container" >/dev/null 2>&1 || true

          # 현재 컨테이너는 즉시 삭제하지 않고 백업 이름으로 보존한다.
          # 새 버전의 기동 또는 health check가 실패하면 이 컨테이너를 다시 시작한다.
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            docker stop "$CONTAINER_NAME"
            docker rename "$CONTAINER_NAME" "$backup_container"
          fi

          run_options=(
            --detach
            --name "$CONTAINER_NAME"
            --restart unless-stopped
            # 외부 사용자가 공인 IP로 접속할 수 있도록 모든 인터페이스에 게시한다.
            # 실제 노출 범위는 OCI Security List와 서버 방화벽이 결정한다.
            --publish "0.0.0.0:${OCI_APP_PORT}:8000"
            --mount "type=volume,source=askmate-data,target=/app/data"
          )

          # 서버에 직접 둔 설정을 먼저 적용하고, 워크플로가 전달한 값으로 덮어쓴다.
          if [[ -f "$env_file" ]]; then
            run_options+=(--env-file "$env_file")
          fi
          run_options+=(--env-file "$deploy_env_file")

          rollback() {
            # 실패 컨테이너를 삭제하기 전에 로그와 종료 코드를 Actions 로그에 남긴다.
            # 기동 실패 원인은 대부분 stderr로 나오므로 표준 출력으로 합쳐 수집한다.
            echo "--- ${CONTAINER_NAME} 컨테이너 로그 (최근 100줄) ---" >&2
            docker logs --tail 100 "$CONTAINER_NAME" 2>&1 || true
            echo "--- 컨테이너 로그 끝 ---" >&2

            health_status="$(docker inspect --format '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo unknown)"
            exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER_NAME" 2>/dev/null || echo unknown)"
            echo "컨테이너 상태: ${health_status}, 종료 코드: ${exit_code}" >&2

            # 실패한 새 컨테이너가 기존 이름을 점유하지 않도록 제거한다.
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true

            # 백업이 존재할 때만 원래 이름으로 되돌리고 서비스를 재개한다.
            if docker container inspect "$backup_container" >/dev/null 2>&1; then
              docker rename "$backup_container" "$CONTAINER_NAME"
              docker start "$CONTAINER_NAME"
            fi
          }

          # docker run 자체가 실패한 경우에도 동일한 롤백 절차를 사용한다.
          if ! docker run "${run_options[@]}" "$TARGET_IMAGE"; then
            rollback
            exit 1
          fi

          # Dockerfile의 HEALTHCHECK가 healthy가 될 때까지 최대 60초(30회 × 2초) 기다린다.
          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER_NAME"
            )"

            if [[ "$health_status" == "healthy" ]]; then
              # 새 버전이 정상 응답할 때만 직전 버전을 최종 삭제한다.
              docker rm --force "$backup_container" >/dev/null 2>&1 || true
              exit 0
            fi

            if [[ "$health_status" == "unhealthy" || "$health_status" == "exited" ]]; then
              break
            fi

            sleep 2
          done

          # 제한 시간 안에 healthy가 되지 않았거나 unhealthy/exited이면 직전 버전으로 복구한다.
          rollback
          exit 1
          REMOTE_SCRIPT
